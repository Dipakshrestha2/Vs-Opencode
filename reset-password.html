<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Pragma Montessori Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #FFF5F5, #EBF4FF, #F0FFF4); }
    .reset-container { width: 100%; max-width: 420px; padding: 20px; }
    .reset-card { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 40px; }
    .reset-logo { text-align: center; margin-bottom: 24px; }
    .reset-logo .logo-icon { font-size: 3rem; }
    .reset-title { font-family: var(--font-heading); font-size: 1.5rem; text-align: center; margin-top: 8px; }
    .reset-subtitle { text-align: center; color: var(--color-gray); margin-bottom: 24px; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .form-control { width: 100%; padding: 12px 16px; border: 2px solid #E0E0E0; border-radius: var(--radius-sm); font-size: 1rem; transition: var(--transition); box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--color-blue); box-shadow: 0 0 0 3px rgba(77,150,255,0.15); }
    .reset-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--color-blue), var(--color-purple)); color: white; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 700; cursor: pointer; transition: var(--transition); }
    .reset-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .reset-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .reset-msg { padding: 10px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .reset-msg.error { background: #FFF0F0; color: var(--color-red); }
    .reset-msg.success { background: #F0FFF4; color: var(--color-green); }
    .reset-footer { text-align: center; margin-top: 20px; }
    .reset-footer a { color: var(--color-blue); font-weight: 600; }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-logo">
        <div class="logo-icon">🔑</div>
        <div class="reset-title">Reset Password</div>
        <div class="reset-subtitle">Set a new password for your account</div>
      </div>
      <div class="reset-msg" id="reset-msg"></div>
      <div id="reset-form-wrap">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your new password" minlength="8" required>
        </div>
        <button class="reset-btn" id="reset-btn">Update Password</button>
      </div>
      <div id="invalid-msg" style="display:none;text-align:center;color:var(--color-gray);padding:16px;">
        <p>This reset link is invalid or has expired.</p>
        <p style="margin-top:8px;"><a href="login.html">Return to Sign In</a></p>
      </div>
      <div class="reset-footer"><a href="login.html" id="back-link">← Back to Sign In</a></div>
    </div>
  </div>

  <script>
    function supabaseLoadFallback() {
      if (window.supabase) return;
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onerror = function () { console.warn('Supabase CDN fallback failed to load.'); };
      document.head.appendChild(s);
    }
  </script>
  <script src="js/vendor/supabase.min.js" onerror="supabaseLoadFallback()"></script>
  <script type="module">
    import { ensureSupabase } from './js/config.js';

    const client = await ensureSupabase();
    const msg = document.getElementById('reset-msg');
    const formWrap = document.getElementById('reset-form-wrap');
    const invalidMsg = document.getElementById('invalid-msg');
    const btn = document.getElementById('reset-btn');
    const hash = window.location.hash || '';
    const looksLikeRecovery = hash.includes('type=recovery') || hash.includes('access_token');

    function show(text, isError) {
      msg.textContent = text;
      msg.className = 'reset-msg ' + (isError ? 'error' : 'success');
      msg.style.display = 'block';
    }

    function hasSession(session) {
      return !!(session && (looksLikeRecovery || session.user?.aud));
    }

    function enableForm() {
      invalidMsg.style.display = 'none';
      formWrap.style.display = 'block';
    }
    function disableForm(reason) {
      formWrap.style.display = 'none';
      invalidMsg.style.display = 'block';
      if (reason) show(reason, true);
    }

    if (!client) {
      disableForm('Cannot connect to the authentication service.');
    } else {
      const { data: { session } } = await client.auth.getSession();
      // A recovery link (or an active session) lets the user set a new password.
      if (hasSession(session)) {
        enableForm();
      } else {
        disableForm('This reset link is invalid or has expired.');
      }
    }

    btn.addEventListener('click', async () => {
      const pw = document.getElementById('new-password').value;
      const pw2 = document.getElementById('confirm-password').value;
      if (pw.length < 8) { show('Password must be at least 8 characters.', true); return; }
      if (pw !== pw2) { show('Passwords do not match.', true); return; }
      btn.disabled = true;
      btn.textContent = 'Updating...';
      const { error } = await client.auth.updateUser({ password: pw });
      btn.disabled = false;
      btn.textContent = 'Update Password';
      if (error) {
        show(error.message || 'Could not update password.', true);
        return;
      }
      show('Password updated successfully. Please sign in with your new password.');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
